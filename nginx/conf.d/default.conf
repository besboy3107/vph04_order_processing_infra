server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- Backend API (приватный, виден только через этот прокси) ---
    # Слэш в proxy_pass срезает префикс /api: /api/applications -> backend /applications.
    # redirect_slashes=False на бэкенде убирает 307/405 на точных путях.
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8000/;
    }

    # --- pgAdmin (профиль tools: может быть выключен) ---
    # Через docker-DNS resolver + переменную: nginx не падает на старте, если
    # контейнер pgadmin не поднят. При выключенном pgAdmin отдаёт 502 — это ок.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location = /pgadmin {
        return 301 /pgadmin/;
    }

    location /pgadmin/ {
        set $pgadmin_upstream pgadmin:80;
        # С переменной в proxy_pass nginx не срезает префикс автоматически —
        # делаем это вручную, иначе pgAdmin уходит в редирект-петлю на /login.
        rewrite ^/pgadmin/(.*)$ /$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_pass http://$pgadmin_upstream;
    }

    # --- Клиентский сайт и админ-панель (статическая сборка фронтенда) ---
    location = / {
        try_files /index.html =404;
    }

    location = /admin {
        try_files /admin.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
