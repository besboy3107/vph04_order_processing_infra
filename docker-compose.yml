name: vph04-order-processing

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: vph04-nginx
    ports:
      - "${NGINX_BIND:-127.0.0.1}:${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Клиентский сайт отдаём из собранного фронтенда (npm run build -> dist).
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      pgadmin:
        condition: service_started
      backend:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: vph04-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: vph04-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    expose:
      - "80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  registry:
    image: registry:3
    container_name: vph04-registry
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Registry Realm
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
    ports:
      - "${REGISTRY_BIND:-127.0.0.1}:${REGISTRY_PORT:-5000}:5000"
    volumes:
      - registry_data:/var/lib/registry
      - ./registry/auth:/auth:ro
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: vph04-watchtower
    environment:
      # Docker 25+ поднял минимальную версию API; старый клиент watchtower требует форсирования.
      DOCKER_API_VERSION: "1.44"
    command: --label-enable --cleanup --interval ${WATCHTOWER_INTERVAL:-300}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: vph04-backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # /docs открыт на время тестирования (как в уроке). В бою выставить 0.
      BACKEND_DOCS_ENABLED: ${BACKEND_DOCS_ENABLED:-1}
      BACKEND_ROOT_PATH: /api
    # Приватный сервис: порт наружу НЕ публикуется, доступен только внутри сети и через nginx (/api).
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  registry_data:
